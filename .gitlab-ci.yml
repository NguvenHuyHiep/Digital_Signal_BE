build-base-uat:
  stage: build-base-uat
  only:
    refs:
      - uat
    changes:
      - pom.xml
  tags:
    - dsd
  before_script:
    - docker login adview.cxview.ai -u AdView -p adview@2023
  script:
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD BASE DOCKER IMAGE FOR UAT ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t adview.cxview.ai/lpdev/dsd/dsd-backend-base-uat:latest  -f ./docker/Dockerfile_base .
    - echo "====================== PUSH DOCKER IMAGE TO REPOSITORY ========================="
    - docker push adview.cxview.ai/lpdev/dsd/dsd-backend-base-uat:latest

deploy-uat:
  stage: deploy-uat
  tags:
    - dsd
  only:
    refs:
      - uat
  before_script:
    - docker login adview.cxview.ai -u AdView -p adview@2023
  script:
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD DOCKER IMAGE FOR UAT ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t adview.cxview.ai/lpdev/dsd/dsd-backend-uat:latest  -f ./docker/Dockerfile_uat .
    - echo "====================== PUSH DOCKER IMAGE FOR UAT ON COMMIT $CI_COMMIT_TAG========================="
    - docker push adview.cxview.ai/lpdev/dsd/dsd-backend-uat:latest

build-base-prod-myanmar:
  stage: build-base-prod-myanmar
  only:
    refs:
      - prod-myanmar
    changes:
      - pom.xml
  tags:
    - dsd
  before_script:
    - docker login adview.cxview.ai -u AdView -p adview@2023
  script:
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD BASE DOCKER IMAGE FOR PROD-MYANMAR ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t adview.cxview.ai/lpdev/dsd/dsd-backend-base-prod-myanmar:latest  -f ./docker/Dockerfile_base .
    - echo "====================== PUSH DOCKER IMAGE FOR PROD-MYANMAR TO REPOSITORY ========================="
    - docker push adview.cxview.ai/lpdev/dsd/dsd-backend-base-prod-myanmar:latest

deploy-prod-myanmar:
  stage: deploy-prod-myanmar
  tags:
    - dsd
  only:
    refs:
      - prod-myanmar
  before_script:
    - docker login adview.cxview.ai -u AdView -p adview@2023
  script:
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD DOCKER IMAGE FOR PROD-MYANMAR ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t adview.cxview.ai/lpdev/dsd/dsd-backend-prod-myanmar:latest  -f ./docker/Dockerfile_prod_myanmar .
    - echo "====================== PUSH DOCKER IMAGE FOR PROD-MYANMAR ON COMMIT $CI_COMMIT_TAG========================="
    - docker push adview.cxview.ai/lpdev/dsd/dsd-backend-prod-myanmar:latest

