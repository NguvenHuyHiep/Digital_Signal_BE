version: "3.8"

services:
  postgres:
    image: postgres:16.0
    container_name: dsd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpdev
      POSTGRES_PASSWORD: Abcd1234
      POSTGRES_DB: dsd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dsd_internal

  minio:
    image: minio/minio
    container_name: dsd_minio
    command: server /data --console-address ":9090"
    restart: always
    ports:
      - "9002:9000"
      - "9092:9090"
    environment:
      MINIO_ROOT_USER: lpdev
      MINIO_ROOT_PASSWORD: Abcd1234
    volumes:
      - minio_data:/data
    networks:
      - dsd_internal

  backend:
    image: aninfosys.asia:8082/lpdev/dsd/dsd-backend-staging:latest
    environment:
      _JAVA_OPTIONS: "-Xms30m -Xmx1500m"
      SPRING_PROFILES_ACTIVE: "staging"
    ports:
      - "8078:8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - dsd_internal
      - dsd_external

networks:
  dsd_internal:
  dsd_external:
    external: true
    name: "anfo"

volumes:
  postgres_data:
  minio_data:
  backend_logs: